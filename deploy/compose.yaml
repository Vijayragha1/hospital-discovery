name: hospital-discovery

x-app: &app
  image: ${API_IMAGE:-hospital-discovery-api:pilot}
  pull_policy: never
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 3g
  cpus: 2
  tmpfs: ["/tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001"]
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://discovery:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/discovery
    ENVIRONMENT: production
    DETECTOR_MODE: presidio
    SPACY_MODEL: en_core_web_lg
    TIKA_URL: http://tika:9998
    PAGE_OCR_URL: http://tika:9997
    SECURE_COOKIES: "true"
    SOURCE_ALLOWED_ROOTS: '["/sources"]'
    APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in deploy/.env}
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in deploy/.env}
  volumes:
    - type: bind
      source: ${SOURCE_MOUNT:?Set SOURCE_MOUNT to an existing approved read-only source folder}
      target: /sources
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    pull_policy: never
    restart: unless-stopped
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    environment:
      POSTGRES_DB: discovery
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["catalog:/var/lib/postgresql/data"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=70,gid=70", "/var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70"]
    networks: [catalog]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U discovery -d discovery"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    command: [uvicorn, app.main:app, --host, "0.0.0.0", --port, "8765", --no-access-log]
    networks: [catalog, frontend, parser]
  worker:
    <<: *app
    command: [python, -m, app.worker]
    networks: [catalog, parser]
  tika:
    image: ${TIKA_IMAGE:-hospital-discovery-tika:pilot}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1024m -Djava.io.tmpdir=/tmp -Duser.home=/tmp -Dlog4j.configurationFile=/opt/tika/log4j2.xml"
      OMP_THREAD_LIMIT: "1"
    networks: [parser]
  ingress_guard:
    image: ${WEB_IMAGE:-hospital-discovery-web:pilot}
    pull_policy: never
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/ingress-guard.sh"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"]
    volumes: ["ingress_state:/run/ingress"]
    tmpfs: ["/run:rw,noexec,nosuid,size=4m"]
    networks: [frontend, ingress]
    depends_on: [api]
    healthcheck:
      test: [CMD-SHELL, "test -f /run/ingress/ready && iptables -w -S OUTPUT | grep -q -- '-P OUTPUT DROP' && ip6tables -w -S OUTPUT | grep -q -- '-P OUTPUT DROP'"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s
  web:
    image: ${WEB_IMAGE:-hospital-discovery-web:pilot}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    volumes:
      - ./certs:/certs:ro
      - ingress_state:/run/ingress:ro
    tmpfs: ["/data:rw,noexec,nosuid,size=32m,uid=10001,gid=10001", "/config:rw,noexec,nosuid,size=16m,uid=10001,gid=10001"]
    network_mode: service:ingress_guard
    depends_on:
      ingress_guard:
        condition: service_healthy
        restart: true

networks:
  catalog:
    internal: true
  parser:
    internal: true
  frontend:
    internal: true
  ingress:
    internal: false
volumes:
  catalog:
  ingress_state:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0755
